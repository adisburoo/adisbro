<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adisbro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Głęboki, kosmiczny granat */
            background-color: #05070a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Nunito', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Warstwa 1: Delikatna mgławica w tle */
        .bg-nebula {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% -10%, rgba(120, 150, 200, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(60, 80, 120, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(40, 60, 100, 0.15) 0%, transparent 50%);
            z-index: -3;
        }

        /* Warstwa 2: Świecący, księżycowy horyzont */
        .bg-moon {
            position: fixed;
            bottom: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 120vw;
            height: 60vh;
            max-width: 1200px;
            border-radius: 50% 50% 0 0;
            background: radial-gradient(ellipse at bottom, rgba(180, 200, 230, 0.15) 0%, rgba(10, 15, 25, 0) 70%);
            z-index: -2;
            filter: blur(10px);
        }

        /* Warstwa 3: Ostre gwiazdy (nieskończona rozdzielczość) */
        .bg-stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1.5px 1.5px at 15% 25%, #ffffff, transparent),
                radial-gradient(2px 2px at 40% 15%, #e2e8f0, transparent),
                radial-gradient(1px 1px at 75% 30%, #ffffff, transparent),
                radial-gradient(2.5px 2.5px at 85% 70%, #cbd5e1, transparent),
                radial-gradient(1.5px 1.5px at 20% 80%, #ffffff, transparent),
                radial-gradient(1px 1px at 60% 90%, #e2e8f0, transparent),
                radial-gradient(2px 2px at 10% 50%, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, #ffffff, transparent);
            background-repeat: repeat;
            background-size: 250px 250px;
            z-index: -1;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        /* Kontener główny */
        .container {
            max-width: 380px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1.5s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* Biała obramówka (Polaroid) */
        .polaroid {
            background: #ffffff; /* Czysta biel */
            padding: 12px 12px 50px 12px; /* Białe marginesy */
            border-radius: 2px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7), 
                0 0 20px rgba(255, 255, 255, 0.1); /* Delikatna poświata wokół ramki */
            transform: rotate(-2deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 35px;
            width: 100%;
            position: relative;
        }
        
        .polaroid:hover { transform: rotate(0deg) scale(1.03); }
        
        .polaroid img {
            width: 100%;
            display: block;
            border-radius: 1px;
            background-color: #e2e8f0;
            height: 380px;
            object-fit: cover;
            object-position: center 25%;
        }

        /* Efekt taśmy klejącej na górze */
        .polaroid::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(1deg);
            width: 80px;
            height: 25px;
            background: rgba(200, 210, 220, 0.5);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* Imię */
        .name {
            font-family: 'Caveat', cursive;
            color: #f8fafc;
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.2);
            transform: rotate(-1deg);
        }

        .bio {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        }

        /* Linki */
        .links { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #f1f5f9;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 12px 5px;
            border-bottom: 1.5px dashed rgba(203, 213, 225, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .link-left { display: flex; align-items: center; gap: 15px; }
        
        .link-item i.fa-brands { font-size: 1.5rem; color: #64748b; transition: all 0.3s ease; }
        
        .link-item:hover { 
            border-bottom: 1.5px solid #ffffff; 
            color: #ffffff;
        }
        
        .link-item:hover i.fa-brands { color: #ffffff; }
        
        .arrow { font-size: 1rem; opacity: 0.5; transition: transform 0.3s ease, opacity 0.3s ease; }
        .link-item:hover .arrow { transform: translateX(6px); opacity: 1; color: #ffffff; }

        /* Stopka */
        .footer-link {
            margin-top: 50px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.3s ease;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .footer-link:hover { color: #ffffff; }

        /* Powiadomienie Toast */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }
        
        .toast.show { bottom: 40px; }
        
    </style>
</head>
<body>

    <!-- Tło księżycowe -->
    <div class="bg-nebula"></div>
    <div class="bg-moon"></div>
    <div class="bg-stars"></div>

    <div class="container">
        <div class="polaroid">
            <!-- Zdjęcie z zabezpieczeniem: jeśli plik lokalny nie działa, wczyta to z serwera -->
            <img src="Screenshot_20261023-195055.png" alt="adisbro" onerror="this.src='https://i.ibb.co/3s6gZ9H/adisbro-avatar.jpg';">
        </div>

        <h1 class="name">adisbro.</h1>
        <p class="bio">Content Creator</p>

        <div class="links">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@adisburoo" target="_blank" class="link-item">
                <div class="link-left">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow"></i>
            </a>

            <!-- Discord -->
            <div class="link-item" onclick="copyDiscord()">
                <div class="link-left">
                    <i class="fa-brands fa-discord"></i>
                    <span>Discord</span>
                </div>
                <i class="fa-regular fa-copy arrow"></i>
            </div>
        </div>

        <a href="terms.html" class="footer-link">Terms of Service</a>
    </div>

    <div class="toast" id="toast"><i class="fa-solid fa-check"></i> Discord username copied!</div>

    <script>
        function copyDiscord() {
            navigator.clipboard.writeText("adisbro.").then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => { toast.classList.remove("show"); }, 2500);
            }).catch(err => {
                console.error('Copy error: ', err);
            });
        }
    </script>

</body>
</html>
