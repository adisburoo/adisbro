<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adisbro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Głęboki, chłodny grafit (baza motywu) */
            background-color: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Nunito', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* === MOTYW KSĘŻYCOWY (Czysty CSS) === */
        
        /* 1. Miękka, srebrzysta poświata z góry */
        .moon-glow {
            position: fixed;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 150vw;
            height: 100vh;
            background: radial-gradient(ellipse at top, rgba(203, 213, 225, 0.15) 0%, transparent 70%);
            z-index: -2;
            pointer-events: none;
        }

        /* 2. Delikatny, abstrakcyjny sierp księżyca */
        .crescent {
            position: fixed;
            top: 10%;
            right: -5%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            /* Tworzenie sierpa za pomocą cienia wewnętrznego */
            box-shadow: inset -40px 20px 0 0 rgba(203, 213, 225, 0.05);
            filter: blur(3px);
            z-index: -1;
            transform: rotate(-20deg);
            pointer-events: none;
        }

        /* =================================== */

        .container {
            max-width: 380px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1.5s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Biała obramówka (Polaroid) z księżycową poświatą */
        .polaroid {
            background: #ffffff;
            padding: 12px 12px 50px 12px;
            border-radius: 2px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.8), 
                0 0 30px rgba(203, 213, 225, 0.15); /* Srebrna poświata */
            transform: rotate(-2deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 35px;
            width: 100%;
            position: relative;
        }
        
        .polaroid:hover { transform: rotate(0deg) scale(1.03); }
        
        .polaroid img {
            width: 100%;
            display: block;
            border-radius: 1px;
            background-color: #e2e8f0;
            height: 380px;
            object-fit: cover;
            object-position: center 25%;
        }

        /* Taśma klejąca */
        .polaroid::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(1deg);
            width: 80px;
            height: 25px;
            background: rgba(200, 210, 220, 0.5);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .name {
            font-family: 'Caveat', cursive;
            color: #f8fafc;
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(203, 213, 225, 0.3);
            transform: rotate(-1deg);
        }

        .bio {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        }

        .links { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #f1f5f9;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 12px 5px;
            border-bottom: 1.5px dashed rgba(203, 213, 225, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .link-left { display: flex; align-items: center; gap: 15px; }
        .link-item i.fa-brands { font-size: 1.5rem; color: #64748b; transition: all 0.3s ease; }
        .link-item:hover { border-bottom: 1.5px solid #ffffff; color: #ffffff; }
        .link-item:hover i.fa-brands { color: #ffffff; }
        
        .arrow { font-size: 1rem; opacity: 0.5; transition: transform 0.3s ease, opacity 0.3s ease; }
        .link-item:hover .arrow { transform: translateX(6px); opacity: 1; color: #ffffff; }

        .footer-link {
            margin-top: 50px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.3s ease;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .footer-link:hover { color: #ffffff; }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }
        
        .toast.show { bottom: 40px; }

        /* === BANER COOKIES === */
        .cookie-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 90%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cookie-banner.show { transform: translateX(-50%) translateY(0); }
        .cookie-text { color: #cbd5e1; font-size: 0.85rem; line-height: 1.5; text-align: left; }
        .cookie-buttons { display: flex; gap: 10px; }
        .cookie-btn {
            flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: all 0.3s ease; font-family: 'Nunito', sans-serif; border: none;
        }
        .cookie-accept { background: #ffffff; color: #0f172a; }
        .cookie-accept:hover { background: #e2e8f0; }
        .cookie-decline { background: rgba(255, 255, 255, 0.1); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2); }
        .cookie-decline:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <div class="moon-glow"></div>
    <div class="crescent"></div>

    <div class="container">
        <div class="polaroid">
            <img src="https://i.ibb.co/3s6gZ9H/adisbro-avatar.jpg" alt="adisbro">
        </div>

        <h1 class="name">adisbro.</h1>
        <p class="bio">Content Creator</p>

        <div class="links">
            <a href="https://www.tiktok.com/@adisburoo" target="_blank" class="link-item">
                <div class="link-left">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow"></i>
            </a>

            <div class="link-item" onclick="copyDiscord()">
                <div class="link-left">
                    <i class="fa-brands fa-discord"></i>
                    <span>Discord</span>
                </div>
                <i class="fa-regular fa-copy arrow"></i>
            </div>
        </div>

        <a href="https://adisburoo.github.io/adisbro-terms.html/index.html" class="footer-link">Terms of Service</a>
    </div>

    <div class="toast" id="toast"><i class="fa-solid fa-check"></i> Discord username copied!</div>

    <div class="cookie-banner" id="cookieBanner">
        <div class="cookie-text">Ta strona używa plików cookies, aby zapewnić Ci najlepsze doświadczenia. Kontynuując przeglądanie, zgadzasz się na ich użycie.</div>
        <div class="cookie-buttons">
            <button class="cookie-btn cookie-decline" onclick="handleCookies('declined')">Odrzuć</button>
            <button class="cookie-btn cookie-accept" onclick="handleCookies('accepted')">Akceptuj</button>
        </div>
    </div>

    <script>
        function copyDiscord() {
            navigator.clipboard.writeText("adisbro.").then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => { toast.classList.remove("show"); }, 2500);
            }).catch(err => { console.error('Copy error: ', err); });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const cookieBanner = document.getElementById("cookieBanner");
            if (!localStorage.getItem("cookieConsent")) {
                setTimeout(() => { cookieBanner.classList.add("show"); }, 1000); 
            }
        });

        function handleCookies(choice) {
            localStorage.setItem("cookieConsent", choice);
            document.getElementById("cookieBanner").classList.remove("show");
        }
    </script>

</body>
</html>
